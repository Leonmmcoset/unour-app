name: unour
description: Android 和 iOS 竖屏 UNO 游戏。
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  audioplayers: ^6.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
